# Citrine — the base's own values. A machine overrides them in
# /etc/citrine/site.conf. Shell syntax; sourced, never executed.

USER_UID=1001
USER_NAME=citrine
HOSTNAME=citrine
TIMEZONE=Etc/UTC
POOL_LABEL=citrine-data
POOL_MOUNT=/var/mnt/data
POOL_SEED_PART=/dev/disk/by-partlabel/citrine-pool0
BACKUP_MOUNT=/var/mnt/backup

# The drive is found by this filesystem label, never by device. usb-adopt
# refuses anything wearing it, at any policy, so plugging the backup drive in
# can never enrol it in the pool.
BACKUP_LABEL=CITRINE-BK

# How long boot waits for every disk in the pool, a slow USB drive included,
# before mounting degraded or deciding there is no pool and making one.
POOL_WAIT_SEC=60

# A USB disk is adopted into the pool only if it can hold everything the
# internal disk's share does and the policy below lets it. blank = no partition
# table and no filesystem signature; any = adopt whatever is plugged in,
# contents and all; never = off.
POOL_ADOPT_POLICY=blank

IMAGE=ghcr.io/chancearthur/citrine:latest
SITE_REF=main
SITE_DIR=citrine

# The tag the server joins under.
TS_TAGS=tag:server

# Setup's choice, yes or no: whether the machine deploys the shield to its zone
# and tails its Worker.
SHIELD=yes

BACKUP_KEEP="--keep-daily 7 --keep-weekly 5 --keep-monthly 12"

# What a site's citrine.conf may set, read as data by conf.sh. Empty until it does,
# because every script runs under set -u.
REGISTRY=
BUILD=
DATABASES=
BACKUP_PATHS=
BACKUP_DRIVE_PATHS=
BACKUP_EXCLUDE=
SERVE=
SERVE_TCP=
