# Cloudflare Tunnel, how the internet reaches the site. Zero Trust → Networks → Tunnels.
TUNNEL_TOKEN=

# Backups. Both repositories open with RESTIC_PASSWORD, and nothing can reissue it, so keep it in a password manager. The R2 keys are an R2 API token with Object Read & Write on one bucket, from R2 → API → Manage R2 API Tokens.
RESTIC_PASSWORD=
R2_ACCOUNT_ID=
R2_BUCKET=
R2_ACCESS_KEY_ID=
R2_SECRET_ACCESS_KEY=

# The dashboard's Cloudflare and Allowed tabs, with a token that has Analytics Read and Zone Read on the zone, and Workers Tail Read on the account. The shield also needs the zone's id.
CF_ZONE_ID=
CF_API_TOKEN=

# The shield and the zone's WAF rules, which this machine deploys itself: a token with Workers Scripts Edit on the account, and Workers Routes Edit, Zone WAF Edit and Zone Read on the zone. Left empty, you deploy the shield by hand.
CF_WORKERS_TOKEN=

# For a machine reinstalled without its pool or its login. TS_AUTHKEY rejoins the tailnet by itself, and an OAuth client secret (tskey-client-…) is best because it doesn't expire. USER_PASSWORD sets the file share's password again.
TS_AUTHKEY=
USER_PASSWORD=

# Only if the site's own images are private: a classic GitHub token with read:packages and no expiry.
GH_TOKEN=
