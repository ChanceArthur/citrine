[global]
    vfs objects = catia fruit streams_xattr
    fruit:resource = file
    fruit:metadata = stream
    veto files = /._*/.DS_Store/
    delete veto files = yes

[pool]
    path = /var/mnt/data
    valid users = @wheel
    read only = No
    root preexec = /usr/bin/test -e /var/mnt/data/.pool-ready
    root preexec close = Yes
